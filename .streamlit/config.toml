# Neobrutalist base theme. Borders/shadows/page color live in agentic_ds/theme.py.
# Keep backgroundColor white: dataframes render on it; the page color is painted by CSS.

[theme]
base = "light"
primaryColor = "#EFB3CF"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FFFFFF"
codeBackgroundColor = "#F4EBC8"
textColor = "#171717"
linkColor = "#171717"
borderColor = "#171717"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "12px"
buttonRadius = "999px"
font = "sans-serif"
codeFont = "monospace"
codeFontSize = "0.875rem"
codeTextColor = "#171717"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["36px", "30px", "24px", "20px", "16px", "14px"]
headingFontWeights = [900, 900, 800, 800, 800, 800]
linkUnderline = true
chartCategoricalColors = ["#171717", "#EFB3CF", "#A9D6CB", "#B3DDEB", "#A6E3B8", "#F09A93", "#F5D88A"]

grayColor = "#171717"
blueColor = "#B3DDEB"
greenColor = "#A6E3B8"
redColor = "#F09A93"
yellowColor = "#F5D88A"
orangeColor = "#F5D88A"
violetColor = "#EFB3CF"

dataframeBorderColor = "#171717"
dataframeHeaderBackgroundColor = "#A9D6CB"

[theme.sidebar]
backgroundColor = "#A9D6CB"
secondaryBackgroundColor = "#FFFFFF"
codeBackgroundColor = "#F4EBC8"
textColor = "#171717"
borderColor = "#171717"
primaryColor = "#EFB3CF"
dataframeHeaderBackgroundColor = "#A9D6CB"
dataframeBorderColor = "#171717"
